# Compatibility verification matrix for the DeepSeek Harness portable package.
#
# Runs on every push and on tags v*; each runner is a fresh machine, so every
# run doubles as a clean-environment compatibility check. `fail-fast: false`
# reports every OS even when one fails.
#
# Jobs: build the Windows x64 package, run the verification probe, and upload
# the ZIP, checksum, and rendered verification screenshots as artifacts. A
# separate write-scoped job stages and validates tag releases before publishing.
name: dsh-portable-verify

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-dsh-version:
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.version.outputs.asset_name }}
      dsh_version: ${{ steps.version.outputs.dsh_version }}
      portable_version: ${{ steps.version.outputs.portable_version }}
      previous_portable_sha: ${{ steps.version.outputs.previous_portable_sha }}
      previous_portable_tag: ${{ steps.version.outputs.previous_portable_tag }}
      release_prerelease: ${{ steps.version.outputs.release_prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      source_tag: ${{ steps.version.outputs.source_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test isolated Release staging and publication
        shell: pwsh
        run: |
          & ./.github/scripts/release-scripts.test.ps1
          & ./.github/scripts/portable-release-policy.test.ps1

      - name: Resolve one exact dsh version for this run
        id: version
        shell: pwsh
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/portable-release-policy.ps1
          $versionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?<prerelease>(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $semverBody = $versionPattern.Substring(1, $versionPattern.Length - 2)
          $officialTagPattern = '^dsh-v(?<version>' + $semverBody + ')$'
          $officialVersions = @()
          for ($page = 1; ; $page++) {
            $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/deepseek-ai/deepseek-harness/tags?per_page=100&page=$page"
            $entries = @($response | ForEach-Object { $_ })
            foreach ($entry in $entries) {
              $match = [regex]::Match([string]$entry.name, $officialTagPattern)
              if (-not $match.Success) { continue }
              $candidateVersion = [string]$match.Groups['version'].Value
              $officialVersions += [pscustomobject]@{
                Version = $candidateVersion
                Parsed = [System.Management.Automation.SemanticVersion]::Parse($candidateVersion)
                Sha = [string]$entry.commit.sha
                Tag = [string]$entry.name
              }
            }
            if ($entries.Count -lt 100) { break }
          }
          if ($officialVersions.Count -eq 0) { throw 'official repository has no dsh-v<SemVer> tag' }
          if ($env:REF_TYPE -eq 'tag') {
            $requestedVersion = (Get-Content ./.github/portable-dsh-version.txt -Raw).Trim()
            $selected = @($officialVersions | Where-Object { $_.Version -ceq $requestedVersion })
          } else {
            $selected = @(Get-DshUniqueHighestSemverRecord -Records $officialVersions -Description 'official dsh tags')
          }
          if ($selected.Count -ne 1) { throw 'the selected dsh version has no unique official source tag' }
          $version = [string]$selected[0].Version
          $sourceTag = [string]$selected[0].Tag
          $sourceSha = [string]$selected[0].Sha
          $versionMatch = [regex]::Match($version, $versionPattern)
          if (-not $versionMatch.Success) { throw "unexpected dsh version: $version" }
          $previousPortableTag = ''
          $previousPortableSha = ''
          $portableVersion = $version
          $releasePrerelease = $versionMatch.Groups['prerelease'].Success
          if ($env:REF_TYPE -eq 'tag') {
            $portableTagPattern = '^v(?<version>' + $versionPattern.Substring(1, $versionPattern.Length - 2) + ')$'
            $currentMatch = [regex]::Match($env:CURRENT_TAG, $portableTagPattern)
            if (-not $currentMatch.Success) { throw "invalid portable tag: $env:CURRENT_TAG" }
            $portableVersion = [string]$currentMatch.Groups['version'].Value
            $releasePrerelease = $currentMatch.Groups['prerelease'].Success
            $currentVersion = [System.Management.Automation.SemanticVersion]::Parse($portableVersion)
            $releases = @()
            for ($page = 1; $page -le 100; $page++) {
              $releaseResponse = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100&page=$page"
              $pageReleases = @($releaseResponse | ForEach-Object { $_ })
              $releases += $pageReleases
              if ($pageReleases.Count -lt 100) { break }
              if ($page -eq 100) { throw 'portable Release pagination exceeded 100 pages' }
            }
            $earlierReleases = @(
              Get-DshCompletePortableReleases -Releases $releases |
                Where-Object { $_.Parsed -lt $currentVersion }
            )
            if ($earlierReleases.Count -gt 0) {
              $previous = Get-DshUniqueHighestSemverRecord -Records $earlierReleases -Description 'previous portable Releases'
              $previousPortableTag = [string]$previous.Tag
              $previousCommit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/commits/$([uri]::EscapeDataString($previousPortableTag))"
              $previousPortableSha = ([string]$previousCommit.sha).ToLowerInvariant()
              if ($previousPortableSha -cnotmatch '^[0-9a-f]{40}$') { throw "previous portable tag $previousPortableTag did not resolve to an exact commit" }
              $recordedTarget = [string]$previous.Release.target_commitish
              if ($recordedTarget -cmatch '^[0-9a-fA-F]{40}$' -and $recordedTarget.ToLowerInvariant() -cne $previousPortableSha) {
                throw "previous portable tag $previousPortableTag moved from its recorded Release target"
              }
            }
          }
          $assetName = "CedarDSH-Desktop-win64-v$portableVersion.zip"
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "dsh_version=$version" >> $env:GITHUB_OUTPUT
          "portable_version=$portableVersion" >> $env:GITHUB_OUTPUT
          "previous_portable_sha=$previousPortableSha" >> $env:GITHUB_OUTPUT
          "previous_portable_tag=$previousPortableTag" >> $env:GITHUB_OUTPUT
          "release_prerelease=$($releasePrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "source_tag=$sourceTag" >> $env:GITHUB_OUTPUT

  pack-official-source:
    needs: resolve-dsh-version
    permissions:
      contents: read
    uses: ./.github/workflows/pack-official-dsh.yml
    with:
      dsh_version: ${{ needs.resolve-dsh-version.outputs.dsh_version }}
      source_sha: ${{ needs.resolve-dsh-version.outputs.source_sha }}
      source_tag: ${{ needs.resolve-dsh-version.outputs.source_tag }}

  build-and-verify:
    needs: [resolve-dsh-version, pack-official-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the verified official source packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.pack-official-source.outputs.artifact_name }}
          path: .upstream-packages

      - name: Test desktop shell
        shell: pwsh
        run: |
          & .\.github\scripts\portable-build-metadata.test.ps1
          & .\shell\update-helper.test.ps1
          node --test .\shell\startup-progress.test.js .\shell\update.test.js .\shell\update-install.test.js .\shell\diagnostics.test.js .\shell\launch-args.test.js .\shell\process-lifecycle.test.js .\plugin\desktop-update\client.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package
        shell: pwsh
        env:
          DSH_VERSION: ${{ needs.resolve-dsh-version.outputs.dsh_version }}
          PORTABLE_VERSION: ${{ needs.resolve-dsh-version.outputs.portable_version }}
          SOURCE_SHA: ${{ needs.resolve-dsh-version.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-dsh-version.outputs.source_tag }}
        run: |
          .\build-portable.ps1 `
            -DshVersion $env:DSH_VERSION `
            -PortableVersion $env:PORTABLE_VERSION `
            -DshPackageDirectory (Resolve-Path .\.upstream-packages) `
            -DshSourceTag $env:SOURCE_TAG `
            -DshSourceSha $env:SOURCE_SHA `
            -ElectronMirror github

      - name: Verify package (compatibility probe)
        shell: pwsh
        env:
          ASSET_NAME: ${{ needs.resolve-dsh-version.outputs.asset_name }}
          DSH_VERSION: ${{ needs.resolve-dsh-version.outputs.dsh_version }}
          PORTABLE_VERSION: ${{ needs.resolve-dsh-version.outputs.portable_version }}
          SOURCE_SHA: ${{ needs.resolve-dsh-version.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-dsh-version.outputs.source_tag }}
        run: |
          .\verify-package.ps1 `
            -ZipPath (Join-Path .\dist $env:ASSET_NAME) `
            -ExpectedDshVersion $env:DSH_VERSION `
            -ExpectedPortableVersion $env:PORTABLE_VERSION `
            -ExpectedDshSourceTag $env:SOURCE_TAG `
            -ExpectedDshSourceSha $env:SOURCE_SHA

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-portable-${{ matrix.os }}-${{ needs.resolve-dsh-version.outputs.portable_version }}
          path: |
            dist/${{ needs.resolve-dsh-version.outputs.asset_name }}
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Upload verification screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-portable-ui-${{ matrix.os }}-${{ needs.resolve-dsh-version.outputs.portable_version }}
          path: |
            .build/startup-progress.png
            .build/startup-progress-state.json
            .build/smoke.png
          include-hidden-files: true
          retention-days: 14

  verify-release-candidate:
    needs: [resolve-dsh-version, build-and-verify]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the exact Windows 2025 Release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-portable-windows-2025-${{ needs.resolve-dsh-version.outputs.portable_version }}
          path: dist

      - name: Verify the exact Release candidate
        shell: pwsh
        env:
          ASSET_NAME: ${{ needs.resolve-dsh-version.outputs.asset_name }}
          DSH_VERSION: ${{ needs.resolve-dsh-version.outputs.dsh_version }}
          PORTABLE_VERSION: ${{ needs.resolve-dsh-version.outputs.portable_version }}
          SOURCE_SHA: ${{ needs.resolve-dsh-version.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-dsh-version.outputs.source_tag }}
        run: |
          .\verify-package.ps1 `
            -ZipPath (Join-Path .\dist $env:ASSET_NAME) `
            -ExpectedDshVersion $env:DSH_VERSION `
            -ExpectedPortableVersion $env:PORTABLE_VERSION `
            -ExpectedDshSourceTag $env:SOURCE_TAG `
            -ExpectedDshSourceSha $env:SOURCE_SHA

  publish-tag-release:
    needs: [resolve-dsh-version, build-and-verify, verify-release-candidate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: dsh-portable-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the Windows 2025 verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-portable-windows-2025-${{ needs.resolve-dsh-version.outputs.portable_version }}
          path: release-assets

      - name: Confirm the official source remains unchanged
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.resolve-dsh-version.outputs.source_sha }}
          EXPECTED_TAG: ${{ needs.resolve-dsh-version.outputs.source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $commit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/deepseek-ai/deepseek-harness/commits/$([uri]::EscapeDataString($env:EXPECTED_TAG))"
          if ([string]$commit.sha -cne $env:EXPECTED_SHA) { throw 'official dsh tag moved before publication' }

      - name: Confirm the manual portable version remains monotonic
        shell: pwsh
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          CURRENT_VERSION: ${{ needs.resolve-dsh-version.outputs.portable_version }}
          EXPECTED_PREVIOUS_SHA: ${{ needs.resolve-dsh-version.outputs.previous_portable_sha }}
          EXPECTED_PREVIOUS_TAG: ${{ needs.resolve-dsh-version.outputs.previous_portable_tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          . ./.github/scripts/portable-release-policy.ps1
          $releases = @()
          for ($page = 1; $page -le 100; $page++) {
            $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100&page=$page"
            $entries = @($response | ForEach-Object { $_ })
            $releases += $entries
            if ($entries.Count -lt 100) { break }
            if ($page -eq 100) { throw 'portable Release pagination exceeded 100 pages during manual publication' }
          }
          $allocation = Assert-DshManualPortableAllocationCurrent `
            -Releases $releases `
            -CurrentTag $env:CURRENT_TAG `
            -CurrentVersion $env:CURRENT_VERSION `
            -ExpectedPreviousPortableCommit $env:EXPECTED_PREVIOUS_SHA `
            -ExpectedPreviousPortableTag $env:EXPECTED_PREVIOUS_TAG `
            -AllowExactAlreadyPublic
          if ($allocation.AlreadyPublic) {
            Write-Output 'the exact manual portable Release is already complete; exact-id staging will validate it read-only'
          }

      - name: Stage verified Draft Release by exact id
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ZIP_NAME: ${{ needs.resolve-dsh-version.outputs.asset_name }}
          TARGET_COMMIT: ${{ github.sha }}
          PREVIOUS_SHA: ${{ needs.resolve-dsh-version.outputs.previous_portable_sha }}
          PREVIOUS_TAG: ${{ needs.resolve-dsh-version.outputs.previous_portable_tag }}
          PRERELEASE: ${{ needs.resolve-dsh-version.outputs.release_prerelease }}
          PORTABLE_VERSION: ${{ needs.resolve-dsh-version.outputs.portable_version }}
          DSH_VERSION: ${{ needs.resolve-dsh-version.outputs.dsh_version }}
          SOURCE_SHA: ${{ needs.resolve-dsh-version.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-dsh-version.outputs.source_tag }}
          RELEASE_BODY: |
            <!-- portable-version: ${{ needs.resolve-dsh-version.outputs.portable_version }} -->
            <!-- dsh-version: ${{ needs.resolve-dsh-version.outputs.dsh_version }} -->
            <!-- upstream-source-tag: ${{ needs.resolve-dsh-version.outputs.source_tag }} -->
            <!-- upstream-source-sha: ${{ needs.resolve-dsh-version.outputs.source_sha }} -->
            **CedarDSH Desktop: download one ZIP, extract it, and run DeepSeek Harness on Windows.**

            This release contains DSH `${{ needs.resolve-dsh-version.outputs.dsh_version }}` from `${{ needs.resolve-dsh-version.outputs.source_tag }}`. Download the ZIP, extract it, and double-click `CedarDSH-Desktop.exe`. No Node.js, installer, or administrator access is required.

            Settings and sessions stay in the portable `dsh-home` folder. The ZIP contains no optional plugins. It passed real UI boot checks on Windows Server 2022 and 2025; verify it against `SHA256SUMS.txt`.
        run: |
          if ([bool]$env:PREVIOUS_TAG -ne [bool]$env:PREVIOUS_SHA) {
            throw 'previous portable tag and commit must be supplied together'
          }
          if ($env:PREVIOUS_TAG) {
            $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $previousCommit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/commits/$([uri]::EscapeDataString($env:PREVIOUS_TAG))"
            if ([string]$previousCommit.sha -cne $env:PREVIOUS_SHA) {
              throw "previous portable tag $env:PREVIOUS_TAG moved before release-note generation"
            }
          }
          $stage = @{
            Repository = $env:REPOSITORY
            Tag = $env:RELEASE_TAG
            PackageName = $env:ZIP_NAME
            TargetCommitish = $env:TARGET_COMMIT
            Prerelease = $env:PRERELEASE
            ReleaseName = "CedarDSH Desktop v$env:PORTABLE_VERSION · Windows Portable (DSH $env:DSH_VERSION)"
            Body = $env:RELEASE_BODY
          }
          if ($env:PREVIOUS_TAG) {
            $stage.PreviousTagName = $env:PREVIOUS_TAG
            $stage.GenerateReleaseNotes = $true
            $stage.AppendGeneratedReleaseNotes = $true
          }
          & ./.github/scripts/stage-release.ps1 @stage -RequireExistingTag

      - name: Validate assets and publish Release
        if: steps.stage.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ZIP_NAME: ${{ needs.resolve-dsh-version.outputs.asset_name }}
          DRAFT_TAG: ${{ steps.stage.outputs.draft_tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_BODY_SHA256: ${{ steps.stage.outputs.body_sha256 }}
          EXPECTED_NAME_SHA256: ${{ steps.stage.outputs.name_sha256 }}
          CURRENT_VERSION: ${{ needs.resolve-dsh-version.outputs.portable_version }}
          EXPECTED_PREVIOUS_SHA: ${{ needs.resolve-dsh-version.outputs.previous_portable_sha }}
          EXPECTED_PREVIOUS_TAG: ${{ needs.resolve-dsh-version.outputs.previous_portable_tag }}
          PRERELEASE: ${{ needs.resolve-dsh-version.outputs.release_prerelease }}
          RELEASE_ID: ${{ steps.stage.outputs.release_id }}
          SOURCE_SHA: ${{ needs.resolve-dsh-version.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-dsh-version.outputs.source_tag }}
        run: |
          . ./.github/scripts/portable-release-policy.ps1
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $commit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/deepseek-ai/deepseek-harness/commits/$([uri]::EscapeDataString($env:SOURCE_TAG))"
          if ([string]$commit.sha -cne $env:SOURCE_SHA) { throw 'official dsh tag moved after Draft verification' }

          $releases = @()
          for ($page = 1; $page -le 100; $page++) {
            $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100&page=$page"
            $entries = @($response | ForEach-Object { $_ })
            $releases += $entries
            if ($entries.Count -lt 100) { break }
            if ($page -eq 100) { throw 'portable Release pagination exceeded 100 pages immediately before manual publication' }
          }
          Assert-DshManualPortableAllocationCurrent `
            -Releases $releases `
            -CurrentTag $env:RELEASE_TAG `
            -CurrentVersion $env:CURRENT_VERSION `
            -ExpectedPreviousPortableCommit $env:EXPECTED_PREVIOUS_SHA `
            -ExpectedPreviousPortableTag $env:EXPECTED_PREVIOUS_TAG | Out-Null
          if ([bool]$env:EXPECTED_PREVIOUS_TAG -ne [bool]$env:EXPECTED_PREVIOUS_SHA) {
            throw 'previous portable tag and commit must be supplied together immediately before publication'
          }
          if ($env:EXPECTED_PREVIOUS_TAG) {
            $previousCommit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/commits/$([uri]::EscapeDataString($env:EXPECTED_PREVIOUS_TAG))"
            if ([string]$previousCommit.sha -cne $env:EXPECTED_PREVIOUS_SHA) {
              throw "previous portable tag $env:EXPECTED_PREVIOUS_TAG moved before final publication"
            }
          }

          ./.github/scripts/finalize-release.ps1 `
            -Repository $env:REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -PackageName $env:ZIP_NAME `
            -DraftTag $env:DRAFT_TAG `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedBodySha256 $env:EXPECTED_BODY_SHA256 `
            -ExpectedNameSha256 $env:EXPECTED_NAME_SHA256 `
            -ReleaseId $env:RELEASE_ID `
            -Prerelease $env:PRERELEASE `
            -RequireExistingTag

  # Lightweight cross-OS sanity was considered here; it requires multi-platform
  # packaging (Node runtime + Electron for darwin/linux) in build-portable.ps1.
  # Until then the Windows runner pair above is the compatibility gate.
