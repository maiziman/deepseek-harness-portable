# Detect new official @deepseek-ai/dsh packages, verify a matching portable
# build on both supported Windows runner generations, and publish the Release
# only after both builds pass.
name: dsh-upstream-watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: Optional published dsh version to evaluate instead of npm latest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-upstream-watch
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.detect.outputs.dsh_version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      should_build: ${{ steps.detect.outputs.should_build }}
      tag: ${{ steps.detect.outputs.tag }}
      track_latest: ${{ steps.detect.outputs.track_latest }}
    steps:
      - name: Detect an unpublished upstream version
        id: detect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestedVersion = ([string]$env:REQUESTED_VERSION).Trim()
          $trackLatest = -not $requestedVersion
          $version = $requestedVersion
          if ($trackLatest) {
            $metadata = Invoke-RestMethod -Uri 'https://registry.npmjs.org/@deepseek-ai/dsh'
            $version = [string]$metadata.'dist-tags'.latest
          }
          $versionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?<prerelease>(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+(?<build>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          $versionMatch = [regex]::Match($version, $versionPattern)
          if (-not $versionMatch.Success) {
            throw "unexpected @deepseek-ai/dsh version: $version"
          }

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releases = @()
          for ($page = 1; ; $page++) {
            $pageReleases = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100&page=$page")
            $releases += $pageReleases
            if ($pageReleases.Count -lt 100) { break }
          }
          $assetName = "DeepSeek-Harness-win64-v$version.zip"
          $marker = "<!-- dsh-version: $version -->"
          $alreadyPackaged = $false
          foreach ($release in $releases) {
            $zipMatches = @($release.assets | Where-Object { $_.name -ceq $assetName })
            $sumsMatches = @($release.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
            $hasMarker = ([string]$release.body).Contains($marker)
            if ($release.draft -or ($zipMatches.Count -eq 0 -and -not $hasMarker)) { continue }
            if (@($release.assets).Count -ne 2 -or $zipMatches.Count -ne 1 -or $sumsMatches.Count -ne 1) {
              throw "published Release $($release.tag_name) has an incomplete asset set for dsh $version"
            }
            $zipAsset = $zipMatches[0]
            $sumsAsset = $sumsMatches[0]
            foreach ($asset in @($zipAsset, $sumsAsset)) {
              if ($asset.state -cne 'uploaded' -or [int64]$asset.size -le 0 -or [string]$asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
                throw "published Release asset is incomplete: $($asset.name)"
              }
            }

            $remoteSumsPath = Join-Path $env:RUNNER_TEMP ("dsh-sums-" + [guid]::NewGuid().ToString('N') + '.txt')
            try {
              $downloadHeaders = $headers.Clone()
              $downloadHeaders.Accept = 'application/octet-stream'
              Invoke-WebRequest -Headers $downloadHeaders -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/assets/$($sumsAsset.id)" -OutFile $remoteSumsPath
              if ((Get-Item $remoteSumsPath).Length -ne [int64]$sumsAsset.size) { throw 'published SHA256SUMS.txt size does not match its asset record' }
              $sumsDigest = 'sha256:' + (Get-FileHash $remoteSumsPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($sumsDigest -ne ([string]$sumsAsset.digest).ToLowerInvariant()) { throw 'published SHA256SUMS.txt digest does not match its asset record' }
              $sumLines = @(Get-Content $remoteSumsPath | Where-Object { $_.Trim() })
              $sumPattern = '^' + [regex]::Escape(([string]$zipAsset.digest).Substring(7)) + '  ' + [regex]::Escape($assetName) + '$'
              if ($sumLines.Count -ne 1 -or $sumLines[0] -cnotmatch $sumPattern) { throw 'published SHA256SUMS.txt does not verify the published ZIP' }
            } finally {
              if (Test-Path $remoteSumsPath -PathType Leaf) { Remove-Item -LiteralPath $remoteSumsPath -Force }
            }
            $alreadyPackaged = $true
            break
          }

          "dsh_version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($versionMatch.Groups['prerelease'].Success.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "should_build=$(((-not $alreadyPackaged)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=dsh-v$version" >> $env:GITHUB_OUTPUT
          "track_latest=$($trackLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($alreadyPackaged) {
            Write-Output "dsh $version already has a complete published portable Release"
          } else {
            Write-Output "dsh $version needs a verified portable Release"
          }

  build-and-verify:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test desktop update logic
        shell: pwsh
        run: |
          node --test .\shell\update.test.js

      - name: Build upstream portable package
        shell: pwsh
        env:
          DSH_VERSION: ${{ needs.detect.outputs.dsh_version }}
        run: |
          .\build-portable.ps1 -DshVersion $env:DSH_VERSION -ElectronMirror github

      - name: Verify package
        shell: pwsh
        run: |
          .\verify-package.ps1

      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-portable-${{ matrix.os }}-${{ needs.detect.outputs.dsh_version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

  publish-release:
    needs: [detect, build-and-verify]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the Windows 2025 verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-portable-windows-2025-${{ needs.detect.outputs.dsh_version }}
          path: release-assets

      - name: Check whether the Release is safe to stage
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          DSH_VERSION: ${{ needs.detect.outputs.dsh_version }}
        run: |
          ./.github/scripts/finalize-release.ps1 `
            -Repository $env:REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -ZipName "DeepSeek-Harness-win64-v$env:DSH_VERSION.zip" `
            -Preflight

      - name: Stage verified Draft Release
        id: stage
        if: steps.preflight.outputs.should_stage == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DeepSeek Harness Portable ${{ needs.detect.outputs.dsh_version }}
          draft: true
          prerelease: ${{ needs.detect.outputs.prerelease }}
          fail_on_unmatched_files: true
          body: |
            <!-- dsh-version: ${{ needs.detect.outputs.dsh_version }} -->
            Automated portable release for official `@deepseek-ai/dsh@${{ needs.detect.outputs.dsh_version }}`.

            The attached package passed clean builds and real UI boot probes on Windows Server 2022 and 2025. The Release is published only after both jobs succeed.

            Verify the downloaded ZIP against `SHA256SUMS.txt` before use.
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt

      - name: Confirm scheduled version remains npm latest
        if: steps.preflight.outputs.should_stage == 'true' && needs.detect.outputs.track_latest == 'true'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.detect.outputs.dsh_version }}
        run: |
          $metadata = Invoke-RestMethod -Uri 'https://registry.npmjs.org/@deepseek-ai/dsh'
          $latest = [string]$metadata.'dist-tags'.latest
          if ($latest -cne $env:EXPECTED_VERSION) {
            throw "npm latest changed before publication: expected $env:EXPECTED_VERSION, found $latest"
          }

      - name: Validate assets and publish Release
        if: steps.preflight.outputs.should_stage == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          DSH_VERSION: ${{ needs.detect.outputs.dsh_version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          RELEASE_ID: ${{ steps.stage.outputs.id }}
        run: |
          ./.github/scripts/finalize-release.ps1 `
            -Repository $env:REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -ZipName "DeepSeek-Harness-win64-v$env:DSH_VERSION.zip" `
            -Prerelease $env:PRERELEASE `
            -ReleaseId $env:RELEASE_ID
