# Publish the independent model-capabilities Bundle from its own version tag.
# The package remains separate from portable ZIP Releases and never becomes the
# repository's Latest Release.
name: dsh-model-capabilities-release

on:
  push:
    tags:
      - 'plugin-model-capabilities-v*'

permissions:
  contents: read

concurrency:
  group: plugin-model-capabilities-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-compatibility:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.compatibility.outputs.dsh_version }}
      pnpm_version: ${{ steps.compatibility.outputs.pnpm_version }}
      source_sha: ${{ steps.compatibility.outputs.source_sha }}
      source_tag: ${{ steps.compatibility.outputs.source_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve the exact compatibility target
        id: compatibility
        shell: pwsh
        run: |
          $compatibility = Get-Content ./.github/plugin-compatibility.json -Raw | ConvertFrom-Json
          $semver = '(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          $tagMatch = [regex]::Match([string]$compatibility.dshTag, "^dsh-v(?<version>$semver)$")
          if (-not $tagMatch.Success -or [string]$compatibility.dshSha -notmatch '^[0-9a-f]{40}$' -or
            [string]$compatibility.pnpmVersion -notmatch '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw 'plugin compatibility target is invalid'
          }
          "dsh_version=$($tagMatch.Groups['version'].Value)" >> $env:GITHUB_OUTPUT
          "pnpm_version=$($compatibility.pnpmVersion)" >> $env:GITHUB_OUTPUT
          "source_sha=$($compatibility.dshSha)" >> $env:GITHUB_OUTPUT
          "source_tag=$($compatibility.dshTag)" >> $env:GITHUB_OUTPUT

  pack-official-source:
    needs: resolve-compatibility
    permissions:
      contents: read
    uses: ./.github/workflows/pack-official-dsh.yml
    with:
      dsh_version: ${{ needs.resolve-compatibility.outputs.dsh_version }}
      source_sha: ${{ needs.resolve-compatibility.outputs.source_sha }}
      source_tag: ${{ needs.resolve-compatibility.outputs.source_tag }}

  pack-and-test:
    needs: resolve-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_name: ${{ steps.pack.outputs.package_name }}
      plugin_prerelease: ${{ steps.version.outputs.plugin_prerelease }}
      plugin_version: ${{ steps.version.outputs.plugin_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test isolated Release staging and publication
        shell: pwsh
        run: '& ./.github/scripts/release-scripts.test.ps1'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install the hash-pinned package manager selected by the compatible source
        shell: bash
        env:
          PNPM_VERSION: ${{ needs.resolve-compatibility.outputs.pnpm_version }}
        run: |
          set -euo pipefail
          case "$PNPM_VERSION" in
            11.7.0) expected_sha=deafa7ec98a1218b6a047289b92fbe2395c1e22d3495bb711653013218ee15ee ;;
            *) echo "No trusted pnpm SHA256 is recorded for $PNPM_VERSION" >&2; exit 1 ;;
          esac
          pnpm_root="$RUNNER_TEMP/pinned-pnpm-$PNPM_VERSION"
          pnpm_tgz="$RUNNER_TEMP/pnpm-$PNPM_VERSION.tgz"
          curl --fail --location --silent --show-error \
            "https://registry.npmjs.org/pnpm/-/pnpm-$PNPM_VERSION.tgz" \
            --output "$pnpm_tgz"
          printf '%s  %s\n' "$expected_sha" "$pnpm_tgz" | sha256sum --check --strict
          mkdir -p "$pnpm_root"
          tar -xzf "$pnpm_tgz" -C "$pnpm_root" --strip-components=1
          chmod +x "$pnpm_root/bin/pnpm.cjs"
          ln -s "$pnpm_root/bin/pnpm.cjs" "$pnpm_root/pnpm"
          printf '%s\n' "$pnpm_root" >> "$GITHUB_PATH"
          printf 'PINNED_PNPM_CJS=%s\n' "$pnpm_root/bin/pnpm.cjs" >> "$GITHUB_ENV"
          export PATH="$pnpm_root:$PATH"
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Match the tag to the package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content ./plugins/dsh-model-capabilities/package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $versionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?<prerelease>(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          $versionMatch = [regex]::Match($version, $versionPattern)
          if (-not $versionMatch.Success) { throw "plugin version is not valid Semantic Version text: $version" }
          if ($env:RELEASE_TAG -cne "plugin-model-capabilities-v$version") {
            throw "plugin tag $env:RELEASE_TAG does not match package version $version"
          }
          "plugin_prerelease=$($versionMatch.Groups['prerelease'].Success.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "plugin_version=$version" >> $env:GITHUB_OUTPUT

      - name: Test the plugin
        shell: pwsh
        run: |
          Push-Location ./plugins/dsh-model-capabilities
          try {
            node --test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm pack --ignore-scripts --dry-run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Pack and verify the published files
        id: pack
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $assets | Out-Null
          Push-Location ./plugins/dsh-model-capabilities
          try {
            $packJson = (npm pack --ignore-scripts --json --pack-destination $assets | Out-String)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $packResponse = $packJson | ConvertFrom-Json
          $packs = @($packResponse)
          if ($packs.Count -ne 1) { throw "expected one packed plugin, found $($packs.Count)" }
          $pack = $packs[0]
          $expectedName = "maiziman-dsh-model-capabilities-$env:PLUGIN_VERSION.tgz"
          if ([string]$pack.filename -cne $expectedName) { throw "unexpected plugin package name: $($pack.filename)" }
          $expectedFiles = @(
            'LICENSE',
            'README.md',
            'README.zh.md',
            'capability-detection.js',
            'cordis.patch.yml',
            'index.js',
            'package.json'
          ) | Sort-Object
          $actualFiles = @($pack.files | ForEach-Object { [string]$_.path }) | Sort-Object
          if ([int]$pack.entryCount -ne 7 -or (Compare-Object $expectedFiles $actualFiles)) {
            throw "plugin tarball does not contain exactly the seven published files: $($actualFiles -join ', ')"
          }
          $packagePath = Join-Path $assets $expectedName
          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $expectedName" | Set-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt') -Encoding utf8NoBOM

          $installRoot = Join-Path $env:RUNNER_TEMP 'plugin-tarball-install'
          New-Item -ItemType Directory -Path $installRoot | Out-Null
          npm install --ignore-scripts --no-package-lock --no-save --prefix $installRoot $packagePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $installRoot
          try {
            node --input-type=module -e "const plugin = await import('@maiziman/dsh-model-capabilities'); if (plugin.name !== 'model-capabilities' || typeof plugin.apply !== 'function') process.exit(1)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          "package_name=$expectedName" >> $env:GITHUB_OUTPUT

      - name: Install through the exact compatible official DSH source
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.pack.outputs.package_name }}
          DSH_VERSION: ${{ needs.resolve-compatibility.outputs.dsh_version }}
          PNPM_VERSION: ${{ needs.resolve-compatibility.outputs.pnpm_version }}
          SOURCE_SHA: ${{ needs.resolve-compatibility.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-compatibility.outputs.source_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $officialRoot = Join-Path $env:RUNNER_TEMP 'deepseek-harness-compatibility'
          $dshHome = Join-Path $env:RUNNER_TEMP 'dsh-plugin-compatibility-home'
          $packagePath = (Resolve-Path (Join-Path ./release-assets $env:PACKAGE_NAME)).Path
          git init $officialRoot | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $officialRoot remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $officialRoot fetch --no-tags --depth 1 origin "refs/tags/$env:SOURCE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolvedSha = (git -C $officialRoot rev-parse 'FETCH_HEAD^{commit}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($resolvedSha -cne $env:SOURCE_SHA) {
            throw "official tag $env:SOURCE_TAG resolved to $resolvedSha instead of $env:SOURCE_SHA"
          }
          git -C $officialRoot checkout --detach $resolvedSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $rootManifest = Get-Content (Join-Path $officialRoot 'package.json') -Raw | ConvertFrom-Json
          $cliManifest = Get-Content (Join-Path $officialRoot 'apps/cli/package.json') -Raw | ConvertFrom-Json
          if ([string]$rootManifest.version -cne $env:DSH_VERSION -or [string]$cliManifest.version -cne $env:DSH_VERSION) {
            throw "official root and CLI versions do not match $env:DSH_VERSION"
          }
          if ([string]$rootManifest.packageManager -cne "pnpm@$env:PNPM_VERSION") {
            throw "official packageManager $($rootManifest.packageManager) does not match pnpm@$env:PNPM_VERSION"
          }
          $installedPnpm = (& node $env:PINNED_PNPM_CJS --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($installedPnpm -cne $env:PNPM_VERSION) {
            throw "pnpm version $installedPnpm does not match compatibility pin $env:PNPM_VERSION"
          }

          Push-Location $officialRoot
          try {
            & node $env:PINNED_PNPM_CJS install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & node $env:PINNED_PNPM_CJS run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:DSH_HOME = $dshHome
            & node $env:PINNED_PNPM_CJS dsh plugin --profile web add $packagePath --offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dump = (& node $env:PINNED_PNPM_CJS dsh --profile web --dump-config | Out-String)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($required in @('@maiziman/dsh-model-capabilities', 'reasoningProbe', 'visionProbe')) {
              if (-not $dump.Contains($required)) { throw "expanded Web profile is missing $required" }
            }
            & node $env:PINNED_PNPM_CJS dsh --profile web --help | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $serverOut = Join-Path $env:RUNNER_TEMP 'dsh-plugin-compatibility-server.out.log'
            $serverErr = Join-Path $env:RUNNER_TEMP 'dsh-plugin-compatibility-server.err.log'
            $node = (Get-Command node -ErrorAction Stop).Source
            $server = Start-Process `
              -FilePath $node `
              -ArgumentList @('--import', 'tsx/esm', 'apps/cli/src/bin.ts', 'web', '--no-open', '--port', '0') `
              -WorkingDirectory $officialRoot `
              -RedirectStandardOutput $serverOut `
              -RedirectStandardError $serverErr `
              -PassThru
            try {
              $ready = $false
              $deadline = [DateTime]::UtcNow.AddSeconds(120)
              while ([DateTime]::UtcNow -lt $deadline -and -not $server.HasExited) {
                $serverText = @(
                  if (Test-Path -LiteralPath $serverOut -PathType Leaf) { Get-Content -LiteralPath $serverOut -Raw }
                  if (Test-Path -LiteralPath $serverErr -PathType Leaf) { Get-Content -LiteralPath $serverErr -Raw }
                ) -join "`n"
                if ($serverText -match 'dsh web: http://127\.0\.0\.1:[0-9]+') {
                  $ready = $true
                  break
                }
                Start-Sleep -Seconds 1
              }
              if (-not $ready) {
                $serverText = @(
                  if (Test-Path -LiteralPath $serverOut -PathType Leaf) { Get-Content -LiteralPath $serverOut -Raw }
                  if (Test-Path -LiteralPath $serverErr -PathType Leaf) { Get-Content -LiteralPath $serverErr -Raw }
                ) -join "`n"
                $exitText = if ($server.HasExited) { [string]$server.ExitCode } else { 'running' }
                throw "compatible Web profile did not announce a URL within 120s (exit=$exitText)`n$serverText"
              }
            } finally {
              if (-not $server.HasExited) {
                Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
                if (-not $server.WaitForExit(10000)) { throw 'compatibility Web profile did not stop within 10s' }
              }
            }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-model-capabilities-${{ steps.version.outputs.plugin_version }}
          path: |
            release-assets/*.tgz
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  portable-compatibility:
    needs: [resolve-compatibility, pack-official-source, pack-and-test]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified official source packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.pack-official-source.outputs.artifact_name }}
          path: .upstream-packages

      - name: Download the exact plugin candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-model-capabilities-${{ needs.pack-and-test.outputs.plugin_version }}
          path: plugin-assets

      - name: Build and verify a pure portable candidate
        shell: pwsh
        env:
          DSH_VERSION: ${{ needs.resolve-compatibility.outputs.dsh_version }}
          SOURCE_SHA: ${{ needs.resolve-compatibility.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-compatibility.outputs.source_tag }}
        run: |
          .\build-portable.ps1 `
            -DshVersion $env:DSH_VERSION `
            -PortableVersion '0.0.0' `
            -DshPackageDirectory (Resolve-Path .\.upstream-packages) `
            -DshSourceTag $env:SOURCE_TAG `
            -DshSourceSha $env:SOURCE_SHA `
            -ElectronMirror github
          .\verify-package.ps1 `
            -ExpectedDshVersion $env:DSH_VERSION `
            -ExpectedPortableVersion '0.0.0' `
            -ExpectedDshSourceTag $env:SOURCE_TAG `
            -ExpectedDshSourceSha $env:SOURCE_SHA

      - name: Install the plugin through the extracted Pure Portable ZIP offline
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ needs.pack-and-test.outputs.package_name }}
          PLUGIN_VERSION: ${{ needs.pack-and-test.outputs.plugin_version }}
          PNPM_VERSION: ${{ needs.resolve-compatibility.outputs.pnpm_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'dsh-pure-portable-plugin-test'
          $zip = Resolve-Path .\dist\DeepSeek-Harness-win64-v0.0.0.zip
          $zipEntries = @(tar -tf $zip)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundledPluginEntries = @($zipEntries | Where-Object {
              $_ -match '(?i)(?:^|[/\\])(?:@maiziman[/\\]dsh-model-capabilities|plugins[/\\]dsh-model-capabilities|maiziman-dsh-model-capabilities-[^/\\]+\.tgz)(?:[/\\]|$)'
            })
          if ($bundledPluginEntries.Count -ne 0) {
            throw "Pure Portable ZIP unexpectedly bundles the optional plugin: $($bundledPluginEntries -join ', ')"
          }
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          tar -xf $zip -C $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageRoot = Join-Path $testRoot 'DeepSeek-Harness'
          $pluginPath = Join-Path $packageRoot $env:PACKAGE_NAME
          $pluginSource = (Resolve-Path (Join-Path .\plugin-assets $env:PACKAGE_NAME)).Path
          $emptyCorepack = Join-Path $testRoot 'empty-corepack'
          $externalStore = Join-Path $testRoot 'external-pnpm-store'
          $externalState = Join-Path $testRoot 'external-pnpm-state'
          $externalCompileCache = Join-Path $testRoot 'external-node-compile-cache'
          New-Item -ItemType Directory -Force -Path $emptyCorepack | Out-Null
          $env:COREPACK_HOME = $emptyCorepack
          $env:pnpm_config_store_dir = $externalStore
          $env:pnpm_config_state_dir = $externalState
          $env:NODE_COMPILE_CACHE = $externalCompileCache
          $env:PATH = "$packageRoot\runtime;$env:SystemRoot\System32;$env:SystemRoot"
          $runtimePnpm = (& (Join-Path $packageRoot 'runtime\pnpm.cmd') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimePnpm -cne $env:PNPM_VERSION) {
            throw "Pure Portable pnpm is $runtimePnpm instead of $env:PNPM_VERSION"
          }
          Push-Location $packageRoot
          try {
            $pureDump = (& .\dsh.cmd --profile web --dump-config | Out-String)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($unexpected in @('@maiziman/dsh-model-capabilities', 'model-capabilities')) {
              if ($pureDump.Contains($unexpected)) { throw "Pure Portable default profile unexpectedly contains $unexpected" }
            }
            Copy-Item -LiteralPath $pluginSource -Destination $pluginPath
            & .\dsh.cmd plugin --profile web add ".\$env:PACKAGE_NAME" --offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dump = (& .\dsh.cmd --profile web --dump-config | Out-String)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($required in @('@maiziman/dsh-model-capabilities', 'reasoningProbe', 'visionProbe')) {
              if (-not $dump.Contains($required)) { throw "Pure Portable profile is missing $required" }
            }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path (Join-Path $packageRoot 'dsh-home\profiles\web\node_modules\@maiziman\dsh-model-capabilities\package.json'))) {
            throw 'plugin was not installed into the Pure Portable profile'
          }
          if (-not (Test-Path (Join-Path $packageRoot 'dsh-home\pnpm-store\v11') -PathType Container)) {
            throw 'Pure Portable plugin install did not keep its pnpm store under dsh-home'
          }
          if (Test-Path -LiteralPath $externalStore) {
            throw 'Pure Portable plugin install wrote to an inherited external pnpm store'
          }
          if (Test-Path -LiteralPath $externalState) {
            throw 'Pure Portable plugin install wrote to an inherited external pnpm state directory'
          }
          if (Test-Path -LiteralPath $externalCompileCache) {
            throw 'Pure Portable plugin install wrote to an inherited external Node compile cache'
          }
          if (@(Get-ChildItem -LiteralPath $emptyCorepack -Force).Count -ne 0) {
            throw 'Pure Portable plugin install fell through to the empty Corepack cache'
          }

  publish-release:
    needs: [resolve-compatibility, pack-and-test, portable-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-model-capabilities-${{ needs.pack-and-test.outputs.plugin_version }}
          path: release-assets

      - name: Re-resolve compatibility and stage verified plugin Draft Release by exact id
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_NAME: ${{ needs.pack-and-test.outputs.package_name }}
          PLUGIN_VERSION: ${{ needs.pack-and-test.outputs.plugin_version }}
          PRERELEASE: ${{ needs.pack-and-test.outputs.plugin_prerelease }}
          TARGET_COMMIT: ${{ github.sha }}
          DSH_TAG: ${{ needs.resolve-compatibility.outputs.source_tag }}
          DSH_SHA: ${{ needs.resolve-compatibility.outputs.source_sha }}
          RELEASE_BODY: |
            <!-- plugin-version: ${{ needs.pack-and-test.outputs.plugin_version }} -->
            <!-- compatible-dsh-version: ${{ needs.resolve-compatibility.outputs.dsh_version }} -->
            <!-- upstream-source-tag: ${{ needs.resolve-compatibility.outputs.source_tag }} -->
            <!-- upstream-source-sha: ${{ needs.resolve-compatibility.outputs.source_sha }} -->
            Independent DeepSeek Harness Bundle for automatic reasoning and image-input capability discovery on custom OpenAI-compatible model providers.

            Compatibility target: DeepSeek Harness `${{ needs.resolve-compatibility.outputs.dsh_version }}` from `${{ needs.resolve-compatibility.outputs.source_tag }}` at the exact commit recorded above. The package passed its complete test suite, published-file check, clean tarball installation, SHA256 verification, installation through that pinned official source, and offline installation through a freshly built Pure Portable ZIP with no global pnpm or Corepack cache. DeepSeek Harness Pure Portable does not bundle or automatically install this plugin.

            DeepSeek Harness Pure Portable users: close `DeepSeek-Harness.exe`, put the verified tarball beside `dsh.cmd`, then run:

            `.\dsh.cmd plugin --profile web add ".\maiziman-dsh-model-capabilities-${{ needs.pack-and-test.outputs.plugin_version }}.tgz" --offline`

            `.\dsh.cmd --profile web --dump-config`

            Reopen the EXE after installation. For a separate global dsh installation, replace `.\dsh.cmd` with `dsh`.
        run: |
          $ErrorActionPreference = 'Stop'
          $officialRoot = Join-Path $env:RUNNER_TEMP 'deepseek-harness-release-identity'
          git init $officialRoot | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $officialRoot remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $officialRoot fetch --no-tags --depth 1 origin "refs/tags/$env:DSH_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolvedSha = (git -C $officialRoot rev-parse 'FETCH_HEAD^{commit}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($resolvedSha -cne $env:DSH_SHA) {
            throw "official tag $env:DSH_TAG moved to $resolvedSha after compatibility testing; expected $env:DSH_SHA"
          }

          ./.github/scripts/stage-release.ps1 `
            -Repository $env:REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -PackageName $env:PACKAGE_NAME `
            -ReleaseName "DSH Custom API Capabilities v$env:PLUGIN_VERSION - Reasoning & Vision Auto-Detection" `
            -Body $env:RELEASE_BODY `
            -TargetCommitish $env:TARGET_COMMIT `
            -Prerelease $env:PRERELEASE `
            -MakeLatest false `
            -RequireExistingTag

      - name: Validate assets and publish plugin Release
        if: steps.stage.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_NAME: ${{ needs.pack-and-test.outputs.package_name }}
          PRERELEASE: ${{ needs.pack-and-test.outputs.plugin_prerelease }}
          DRAFT_TAG: ${{ steps.stage.outputs.draft_tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_BODY_SHA256: ${{ steps.stage.outputs.body_sha256 }}
          EXPECTED_NAME_SHA256: ${{ steps.stage.outputs.name_sha256 }}
          RELEASE_ID: ${{ steps.stage.outputs.release_id }}
          DSH_TAG: ${{ needs.resolve-compatibility.outputs.source_tag }}
          DSH_SHA: ${{ needs.resolve-compatibility.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $officialRoot = Join-Path $env:RUNNER_TEMP 'deepseek-harness-release-identity'
          git -C $officialRoot fetch --no-tags --depth 1 origin "refs/tags/$env:DSH_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolvedSha = (git -C $officialRoot rev-parse 'FETCH_HEAD^{commit}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($resolvedSha -cne $env:DSH_SHA) {
            throw "official tag $env:DSH_TAG moved to $resolvedSha before publication; expected $env:DSH_SHA"
          }

          ./.github/scripts/finalize-release.ps1 `
            -Repository $env:REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -PackageName $env:PACKAGE_NAME `
            -DraftTag $env:DRAFT_TAG `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedBodySha256 $env:EXPECTED_BODY_SHA256 `
            -ExpectedNameSha256 $env:EXPECTED_NAME_SHA256 `
            -ReleaseId $env:RELEASE_ID `
            -Prerelease $env:PRERELEASE `
            -MakeLatest false `
            -RequireExistingTag
