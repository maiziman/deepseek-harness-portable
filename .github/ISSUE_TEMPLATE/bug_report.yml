name: Bug report
description: Report a packaging, startup, or Windows compatibility problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the portable build. Remove API keys, private paths, and workspace content from logs and screenshots.
  - type: input
    id: release
    attributes:
      label: Portable release
      description: Paste the ZIP filename and the dshVersion from manifest.json.
      placeholder: DeepSeek-Harness-win64-v0.1.1-rc.2.zip; dshVersion 0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the extraction path and the exact action that failed.
      placeholder: |
        1. Extracted the ZIP to C:\Tools\DeepSeek-Harness
        2. Double-clicked DeepSeek-Harness.exe
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized verify-package.ps1 output or dsh-home\logs\server.log excerpts when useful.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I used the latest release and extracted it to a short local path.
          required: true
        - label: I removed API keys, credentials, private paths, and workspace content.
          required: true
